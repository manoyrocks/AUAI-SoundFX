<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060a" />

    <title>SoundFX — adaptive audio for focus, calm and sleep</title>
    <meta
      name="description"
      content="Adaptive, on-device audio for focus, calm, recovery and sleep. Every sound is synthesised live from a mathematical model — nothing is recorded, and nothing leaves your device."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS standalone mode: without these the installed app opens in a
         Safari chrome instead of full screen, and the status bar sits on a
         white strip above the dark UI. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SoundFX" />

    <!-- Local-only app: nothing here is shared to a social graph, but a
         correct card is still what a pasted link renders as. -->
    <meta property="og:title" content="SoundFX" />
    <meta
      property="og:description"
      content="Adaptive, on-device audio for focus, calm, recovery and sleep. Synthesised live; nothing recorded, nothing uploaded."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      Rendered before the module loads, and removed by main.ts once the UI is
      up. If the bundle fails to parse or a runtime error kills startup, this
      is what the user sees instead of a permanently blank page.
    -->
    <div id="boot" role="status">
      <div class="boot-mark" aria-hidden="true"></div>
      <p class="boot-text">Starting SoundFX…</p>
      <noscript>
        <p class="boot-text">SoundFX needs JavaScript to synthesise audio. Please enable it and reload.</p>
      </noscript>
    </div>

    <a class="skip-link" href="#main">Skip to session controls</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
